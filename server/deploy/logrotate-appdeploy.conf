# Optional alternative for deployment/update-server-0.1.23.py / 0.1.24.py installations.
# Install only after checking the actual version directory and account/group.
# Do not install together with another rule covering these files.
/app/EndpointAIDLP-Server-*/logs/app.log {
    daily
    maxsize 20M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 appdeploy appdeploy
    su appdeploy appdeploy
}

# Gunicorn stdout/stderr inherits an open descriptor; it does not use WatchedFileHandler.
# copytruncate bounds it without a service restart but has a small copy/truncate loss window.
/app/EndpointAIDLP-Server-*/console.log {
    daily
    maxsize 20M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su appdeploy appdeploy
}
