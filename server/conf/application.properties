# EndpointAIDLP ControlServer 应用配置
# 容器模式从 APP_CONFIG 环境变量指定目录加载；本地模式从此 conf/ 目录加载

# 运行环境：sit / prd（决定加载 mysql_sit.properties 还是 mysql_prd.properties）
app.env=sit
server.http-host=0.0.0.0
transport.key-id=production-2026-01
# transport.key= (Base64 32 bytes; provide separately)

# 监听端口
server.http-port=8080

# 路由策略默认值
policy.route-mode=FixedGateway
policy.gateway-origin=http://security-proxy.sf-express.com
policy.allow-insecure-gateway=true
policy.poll-interval-seconds=60
policy.heartbeat-interval-seconds=60
policy.enabled=true

# 认证 Token（生产环境通过环境变量注入，禁止在此填写真实值）
# auth.client-token=
# auth.admin-token=
# auth.policy-hmac-key=  (Base64 编码，>=32 字节)
